---
# Test playbook for Wakapi configuration

- name: Define wakapi group dynamically
  hosts: all
  gather_facts: false
  tasks:
    - name: Add host to wakapi_hosts group if it has the role
      ansible.builtin.group_by:
        key: "wakapi_hosts"
      when: "'wakapi' in hostvars[inventory_hostname].get('host_roles', [])"
      changed_when: false

- name: Test Wakapi deployment
  hosts: wakapi_hosts
  become: true
  vars:
    install_wakapi: true
    wakapi_public_url: "http://{{ ansible_default_ipv4.address }}:3000"
  roles:
    - wakapi

  post_tasks:
    - name: Verify wakapi is running
      ansible.builtin.uri:
        url: "{{ wakapi_public_url }}"
        method: GET
        status_code: 200
      retries: 5
      delay: 10

    - name: Display wakapi URL
      ansible.builtin.debug:
        msg: "Wakapi is available at: {{ wakapi_public_url }}"
