server { 
  server_name weather.cusack-ruth.name;
  root /var/www/weather.cusack-ruth.name;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ; # managed by Certbot
    http2 on;
    ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # add_header Set-Cookie "VouchCookie=deleted; Expires=Thu, 01-Jan-1970 00:00:01 GMT; Path=/; Domain=.cusack-ruth.name";

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

    location /mqtt {
      proxy_pass http://192.168.7.239:9001/mqtt;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
      proxy_read_timeout 86400;
    }
}
server {
  listen 80;
  listen [::]:80;
  server_name weather.cusack-ruth.name;
  location / {
    return 301 https://$host$request_uri;
  }


  location /.well-known/acme-challenge/ {
      root /var/www/certbot;
  }
}
