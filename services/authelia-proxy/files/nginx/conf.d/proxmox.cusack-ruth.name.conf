upstream proxmox {
  server proxmox-main.cusack-ruth.name:8006 max_fails=0;
}

server {
  server_name proxmox.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;

  client_max_body_size 0;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /robots.txt {
    add_header Content-type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    proxy_pass https://proxmox/;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade"; 
    client_max_body_size 0;
    proxy_ssl_verify off;
    proxy_buffering off;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name proxmox.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
