map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream grafana11 {
  server 192.168.7.198:3011;
}

upstream grafana10 {
  server 192.168.7.198:3010;
}

upstream grafana12 {
  server 192.168.7.198:3012;
}

server {
  server_name grafana.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;

  client_max_body_size 0;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /robots.txt {
    add_header Content-type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    proxy_set_header Remote-User $user;
    proxy_set_header Remote-Groups $groups;
    proxy_set_header Remote-Name $name;
    proxy_set_header Remote-Email $email;
    proxy_pass http://grafana12;
  }

  location /grafana10/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    proxy_set_header Remote-User $user;
    proxy_set_header Remote-Groups $groups;
    proxy_set_header Remote-Name $name;
    proxy_set_header Remote-Email $email;
    proxy_pass http://grafana10;
    rewrite  ^/grafana10/(.*)  /$1 break;
  }

  location /grafana10/api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_pass http://grafana10;
    rewrite  ^/grafana10/(.*)  /$1 break;
  }

  location /grafana11/ {
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    proxy_set_header Remote-User $user;
    proxy_set_header Remote-Groups $groups;
    proxy_set_header Remote-Name $name;
    proxy_set_header Remote-Email $email;
    proxy_pass http://grafana11;
    rewrite  ^/grafana11/(.*)  /$1 break;
  }

  location /grafana11/api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_pass http://grafana11;
    rewrite  ^/grafana11/(.*)  /$1 break;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name grafana.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
