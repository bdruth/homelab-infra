upstream channels {
  server synology.cusack-ruth.name:8089;
}

server {
  server_name channels.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;

  client_max_body_size 0;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /robots.txt {
    add_header Content-type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    proxy_pass http://channels/;
    add_header Strict-Transport-Security "max-age=15768000; includeSubdomains; preload" always;
    proxy_intercept_errors  on;
    proxy_ssl_verify off;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name channels.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
