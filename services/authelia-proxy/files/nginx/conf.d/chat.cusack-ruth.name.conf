server {
  server_name chat.cusack-ruth.name;

  listen 443 ssl;
  listen [::]:443 ssl ;
  http2 on;
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  include /etc/nginx/authelia.conf;
  proxy_http_version 1.1;
  client_max_body_size 100M;

  location / {
    set $upstream_chat http://192.168.7.151:3000;
    proxy_pass $upstream_chat;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }

  # API clients off the LAN: requests carrying a bearer token (Open WebUI API
  # key or session JWT) skip Authelia; Open WebUI validates the token itself.
  # Everything else on these paths (e.g. /api/v1/auths/signin, /api/config)
  # still goes through Authelia.
  location ~ ^/(api|ollama|openai)/ {
    error_page 418 = @chat_api_bearer;
    if ($http_authorization ~* "^Bearer ") { return 418; }

    set $upstream_chat http://192.168.7.151:3000;
    proxy_pass $upstream_chat;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }

  location @chat_api_bearer {
    set $upstream_chat http://192.168.7.151:3000;
    proxy_pass $upstream_chat;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/proxy.conf;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
