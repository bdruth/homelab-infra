server {
  server_name automate.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;

  location /nodered/ {
    proxy_pass http://nodered/;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }
  
  location /nodered/comms {
    proxy_pass http://nodered/comms;
    
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }

  location /grafana/ {
    proxy_pass http://192.168.7.198:3000/;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    proxy_set_header Remote-User $user;
    proxy_set_header Remote-Groups $groups;
    proxy_set_header Remote-Name $name;
    proxy_set_header Remote-Email $email;
    proxy_set_header Host $http_host;
    # include /etc/nginx/auth.conf;
    # include /etc/nginx/proxy.conf;
  }

  location /grafana/api/live {
    rewrite  ^/grafana/(.*)  /$1 break;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $http_host;
    proxy_pass http://192.168.7.198:3000/;
    # include /etc/nginx/auth.conf;
    # include /etc/nginx/proxy.conf;
  }

  location / {
    set $upstream_homebridge http://192.168.7.198:9090;
    proxy_pass $upstream_homebridge;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }

  location /socket.io/ {
    proxy_pass http://socketio/socket.io/;
    
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

}

upstream socketio {
  server 192.168.7.198:9090;
}

upstream nodered {
  server 192.168.7.198:1880;
}

server {
    listen 80;
    listen [::]:80;
    server_name automate.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
