server {
    listen 80;
    listen [::]:80;
    server_name auth.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.cusack-ruth.name;
    ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

    location / {
        set $upstream_authelia http://authelia:9091; # This example assumes a Docker deployment
        proxy_pass $upstream_authelia;
        include /etc/nginx/proxy.conf;
    }
}
