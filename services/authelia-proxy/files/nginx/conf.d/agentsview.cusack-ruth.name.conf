server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name agentsview.cusack-ruth.name;

  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # This archive is private even if a public wildcard DNS record resolves here.
  allow 192.168.7.0/24;
  allow 100.64.0.0/10;
  allow fd7a:115c:a1e0::/48;
  allow fd6a:f459:349e:1::/64;
  deny all;

  include /etc/nginx/authelia.conf;

  location = /robots.txt {
    add_header Content-Type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    proxy_pass http://192.168.7.211:18080;
    include /etc/nginx/auth.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_connect_timeout 10s;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name agentsview.cusack-ruth.name;
  return 301 https://$host$request_uri;
}
