upstream radarr {
  server arr.cusack-ruth.name:7878;
}

upstream sonarr {
  server arr.cusack-ruth.name:8989;
}

upstream bazarr {
  server arr.cusack-ruth.name:6767;
}

upstream prowlarr {
  server arr.cusack-ruth.name:9696;
}

upstream qbittorrent {
  server arr.cusack-ruth.name:8080;
}

server {
  server_name ~^(?<subdomain>(.*?arr|qbittorrent)).cusack-ruth.name$;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;

  client_max_body_size 0;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /robots.txt {
    add_header Content-type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    proxy_pass http://${subdomain};
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    include /etc/nginx/auth.conf;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>(.*?arr|qbittorrent)).cusack-ruth.name$;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
