server {
  server_name n8n.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;
  proxy_http_version 1.1;

  location / {
    set $upstream_n8n http://192.168.7.151:5678;
    proxy_pass $upstream_n8n;
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }

  location /rest/oauth2-credential/auth {
    set $upstream_n8n_oauth2 http://192.168.7.151:5678;
    # save original "Cookie" header value
    set $altered_cookie $http_cookie;

    # check if the "my_cookie" cookie is present
    if ($http_cookie ~ '(.*)(^|;\s)ph_phc_4URIAm1uYfJO7j8kWSe0J8lc8IqnstRLS7Jx8NcakHo_posthog=("[^"]*"|[^\s]*[^;]?)(\2|$|;$)(?:;\s)?(.*)') {
      # cut "my_cookie" cookie from the string
      set $altered_cookie $1$4$5;
    }

    # hide original "Cookie" header
    proxy_hide_header Cookie;

    # set "Cookie" header to the new value
    proxy_set_header  Cookie $altered_cookie;    
    
    proxy_pass $upstream_n8n_oauth2;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
