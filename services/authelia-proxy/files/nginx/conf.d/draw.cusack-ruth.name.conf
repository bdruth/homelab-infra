server {
  server_name draw.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;

  location / {
    set $upstream_excalidraw http://192.168.7.165:5010;
    proxy_pass $upstream_excalidraw;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location /storage {
    set $upstream_storage http://192.168.7.165:5011;
    rewrite  ^/storage/(.*)  /$1 break;
    proxy_pass $upstream_storage;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Security-Policy;
    proxy_hide_header X-WebKit-CSP;
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }
}

server {
  server_name draw-ws.cusack-ruth.name;

  listen 443 ssl; 
  listen [::]:443 ssl ;
  http2 on; 
  ssl_certificate /etc/letsencrypt/live/cusack-ruth.name/fullchain.pem; 
  ssl_certificate_key /etc/letsencrypt/live/cusack-ruth.name/privkey.pem; 
  include /etc/letsencrypt/options-ssl-nginx.conf; 
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 

  include /etc/nginx/authelia.conf;
  
  location / {
    proxy_pass http://192.168.7.165:5012/;
    
    proxy_buffering off;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    include /etc/nginx/auth.conf;
    include /etc/nginx/proxy.conf;
  }
}

server {
    listen 80;
    listen [::]:80;
    server_name draw.cusack-ruth.name;
    location / {
        return 301 https://$host$request_uri;
    }    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
