---
# Handlers run in the order defined here.

- name: Apply compose changes
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ authelia_proxy_compose_dir }}"
  changed_when: true

- name: Restart Authelia
  ansible.builtin.command: docker restart authelia
  changed_when: true

# Validate before reloading so a bad site config can't take every site down;
# a failed nginx -t fails the play and nginx keeps serving the old config.
- name: Validate nginx config
  ansible.builtin.command: docker exec nginx nginx -t
  changed_when: false
  listen: Reload nginx

- name: Reload nginx config
  ansible.builtin.command: docker exec nginx nginx -s reload
  changed_when: true
  listen: Reload nginx
