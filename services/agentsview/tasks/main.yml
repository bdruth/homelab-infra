---
# Adopt only the running pilot; never initialize or replace its data.
- name: Inspect existing AgentsView pilot paths
  ansible.builtin.stat:
    path: "{{ agentsview_root }}/{{ item }}"
  loop:
    - compose.yaml
    - data/config.toml
    - sources
    - secrets/token
  register: agentsview_paths

- name: Require intact pilot and runtime ownership
  ansible.builtin.assert:
    that:
      - agentsview_paths.results | map(attribute='stat.exists') | min
      - agentsview_paths.results[1].stat.uid == 1026
      - agentsview_paths.results[3].stat.uid == 1026
    fail_msg: Existing AgentsView data, sources, token, or ownership differs; inspect before convergence.

- name: Install proxy-only Docker forwarding rule at boot
  ansible.builtin.copy:
    src: agentsview-proxy-firewall.sh
    dest: /usr/local/etc/rc.d/agentsview-proxy-firewall.sh
    owner: root
    group: root
    mode: "0755"

- name: Enforce proxy-only Docker forwarding rule now
  ansible.builtin.command: /usr/local/etc/rc.d/agentsview-proxy-firewall.sh start
  changed_when: false

- name: Set AgentsView browser URL and trusted origin
  ansible.builtin.lineinfile:
    path: "{{ agentsview_root }}/data/config.toml"
    regexp: '^public_url\s*='
    line: 'public_url = "https://agentsview.cusack-ruth.name"'
    insertafter: '^disable_update_check\s*='
    backup: true
  diff: false
  notify: Apply AgentsView compose

# 0.47 pauses ingestion after 10 idle minutes without a browser request.
# Uploads arrive while nobody is browsing, so keep ingesting.
- name: Keep ingesting uploads while no client is connected
  ansible.builtin.lineinfile:
    path: "{{ agentsview_root }}/data/config.toml"
    regexp: '^sync_idle_after\s*='
    line: 'sync_idle_after = "0"'
    insertafter: '^public_url\s*='
    backup: true
  diff: false
  notify: Restart AgentsView

- name: Adopt existing AgentsView compose definition
  ansible.builtin.copy:
    src: compose.yaml
    dest: "{{ agentsview_root }}/compose.yaml"
    owner: "1026"
    group: "100"
    mode: "0644"
    backup: true
  notify: Apply AgentsView compose

# Transcript uploads: each agentsview_uploaders host pushes with its own key,
# forced through the guard into sources/<dir>/ only.
- name: Create upload guard directory
  ansible.builtin.file:
    path: "{{ agentsview_root }}/bin"
    state: directory
    owner: "1026"
    group: "100"
    mode: "0700"

- name: Install upload guard
  ansible.builtin.template:
    src: agentsview-upload-guard.py.j2
    dest: "{{ agentsview_upload_guard }}"
    owner: "1026"
    group: "100"
    mode: "0700"

- name: Install rehydrate read guard
  ansible.builtin.template:
    src: agentsview-read-guard.py.j2
    dest: "{{ agentsview_read_guard }}"
    owner: "1026"
    group: "100"
    mode: "0700"

# No mode: the pilot's existing mac/ folders carry Synology ACLs.
- name: Create per-host source folders  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: "{{ agentsview_sources_root }}/{{ item.0.value.dir }}/{{ item.1 }}"
    state: directory
    owner: "1026"
    group: "100"
  loop: "{{ agentsview_upload_sources | dict2items | product(['claude/projects', 'claude/file-history', 'codex/sessions']) | list }}"
  loop_control:
    label: "{{ item.0.value.dir }}/{{ item.1 }}"

- name: Authorize uploader keys through the guard
  ansible.posix.authorized_key:
    user: "{{ agentsview_nas_user }}"
    key: "{{ hostvars[item].agentsview_upload_pubkey }}"
    key_options: 'command="{{ agentsview_upload_guard }} {{ agentsview_upload_sources[item].dir }}",restrict'
  loop: "{{ groups['agentsview_uploaders'] | default([]) }}"
  when: hostvars[item].agentsview_upload_pubkey is defined

- name: Authorize rehydrate keys through the read guard
  ansible.posix.authorized_key:
    user: "{{ agentsview_nas_user }}"
    key: "{{ hostvars[item].agentsview_read_pubkey }}"
    key_options: 'command="{{ agentsview_read_guard }}",restrict'
  loop: "{{ groups['agentsview_uploaders'] | default([]) }}"
  when: hostvars[item].agentsview_read_pubkey is defined

- name: Register upload sources in AgentsView config
  ansible.builtin.blockinfile:
    path: "{{ agentsview_root }}/data/config.toml"
    marker: "# {mark} ANSIBLE MANAGED: agentsview upload sources"
    block: |
      {% for name, src in agentsview_upload_sources.items() %}
      {% for agent, sub in [['claude', 'claude/projects'], ['codex', 'codex/sessions']] %}
      [[session_sources]]
        agent = "{{ agent }}"
        dir = "/sources/{{ src.dir }}/{{ sub }}"
        machine = "{{ src.machine }}"

      {% endfor %}
      {% endfor %}
    backup: true
  diff: false
  notify: Restart AgentsView

# Semantic search: make sure the embedding model exists on the Ollama host,
# pulled through its API from the NAS so the nvidia-gpu role is untouched.
- name: List models on the embeddings Ollama host
  ansible.builtin.uri:
    url: "{{ agentsview_ollama_url }}/api/tags"
    return_content: true
  register: agentsview_ollama_tags
  check_mode: false

- name: Pull the embedding model on the Ollama host
  ansible.builtin.uri:
    url: "{{ agentsview_ollama_url }}/api/pull"
    method: POST
    body_format: json
    body: { model: "{{ agentsview_embeddings_model }}", stream: false }
    timeout: 900
  when: >-
    agentsview_embeddings_model not in
    (agentsview_ollama_tags.json.models | map(attribute='name') | map('regex_replace', ':latest$', '') | list)
  changed_when: true

# Explicit servers get no model defaults, so the nomic prefixes, context
# and input limit are spelled out. Ollama runs with OLLAMA_NUM_PARALLEL=1,
# so one request at a time with a generous timeout.
# Do not use Settings > Embeddings > Turn on in the UI: it rewrites
# config.toml and drops these markers.
- name: Configure semantic search in AgentsView config
  ansible.builtin.blockinfile:
    path: "{{ agentsview_root }}/data/config.toml"
    marker: "# {mark} ANSIBLE MANAGED: agentsview vector search"
    insertafter: EOF
    block: |
      [vector]
        enabled = true

      [vector.embeddings]
        model = "{{ agentsview_embeddings_model }}"
        dimension = {{ agentsview_embeddings_dimension }}
        max_input_chars = 4000
        model_context_tokens = 2048
        query_prefix = "search_query: "
        document_prefix = "search_document: "

      [vector.embeddings.servers.beelink-gti]
        endpoint = "{{ agentsview_ollama_url }}/v1"
        concurrency = 1
        timeout = "120s"
    backup: true
  diff: false
  notify: Restart AgentsView
