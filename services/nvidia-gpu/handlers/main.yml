---
# Handlers for nvidia-gpu role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Open WebUI service
  ansible.builtin.systemd:
    name: open-webui
    state: restarted

- name: Restart Copilot API service
  ansible.builtin.systemd:
    name: copilot-api
    state: restarted

- name: Restart Open Terminal service
  ansible.builtin.systemd:
    name: open-terminal
    state: restarted

- name: Restart ChatGPT seat services
  ansible.builtin.systemd:
    name: "chatmock-{{ item.name }}"
    state: restarted
  loop: "{{ chatgpt_proxy_seats }}"
  loop_control:
    label: "{{ item.name }}"
  # A seat with no login yet has its unit skipped by ConditionPathExists, so a
  # restart request is a harmless no-op rather than a failure.
  failed_when: false

- name: Restart ChatGPT router service
  ansible.builtin.systemd:
    name: chatgpt-router
    state: restarted

- name: Restart SearXNG service
  ansible.builtin.systemd:
    name: searxng
    state: restarted

- name: Restart ComfyUI service
  ansible.builtin.systemd:
    name: comfyui
    state: restarted
