---
# Handlers for nvidia-gpu role

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart Open WebUI service
  ansible.builtin.systemd:
    name: open-webui
    state: restarted

- name: Restart Copilot API service
  ansible.builtin.systemd:
    name: copilot-api
    state: restarted

- name: Restart Open Terminal service
  ansible.builtin.systemd:
    name: open-terminal
    state: restarted

- name: Restart SearXNG service
  ansible.builtin.systemd:
    name: searxng
    state: restarted

- name: Restart ComfyUI service
  ansible.builtin.systemd:
    name: comfyui
    state: restarted
