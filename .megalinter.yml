---
# Enable only necessary linters for this repo
ENABLE_LINTERS:
  - TERRAFORM_TERRAFORM_FMT
  - YAML_YAMLLINT
  - MARKDOWN_MARKDOWNLINT
  - BASH_SHELLCHECK
  - ANSIBLE_ANSIBLE_LINT

# Skip tool-managed files we don't author, and the Authelia configs kept
# byte-for-byte identical to live on beelink (reformatting breaks parity)
FILTER_REGEX_EXCLUDE: '(\.serena/|services/authelia-proxy/files/secrets/)'
